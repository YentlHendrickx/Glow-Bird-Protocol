[WLED]
WLED_IP = 10.16.111.2
WLED_PORT = 11988

[Audio]
SAMPLE_RATE = 48000
CHUNK_BYTES = 512
GAIN = 1.0

# --- Frequency path (16 GEQ bands) --- PUNCHY: sparse, snappy bars, strong beats.
FFT_WINDOW_SAMPLES = 1024
# Fast fall so bars drop quickly between hits.
BAND_AGC_DECAY = 0.995
# Higher gamma = more contrast / sparser bars (peaks stand out, background dark).
BAND_GAMMA = 0.8
# Strong transient boost so kicks slam in threshold beat-effects (PS Sonic Boom).
BAND_ATTACK = 2.5
# Fold onsets of ALL bands into bin 0 (bass-first via pink-undo tilt): fires on an attack anywhere,
# a kick wins when present, returns to ~0 between hits so beat effects don't skip at high BPM.
BASS_FOLD = 16
BASS_FOLD_ONSET = 1
# Adaptive whitening off by default - toggle on to also catch beats carried by quiet bands.
FOLD_WHITEN = 0
WHITEN_FLOOR = 0.08

# --- Volume path --- snappy volume-reactive effects.
AGC_TARGET = 90
AGC_SPEED = 0.02
AGC_MAX_GAIN = 2000
# Higher floor keeps near-silence between hits clean.
SQUELCH = 50
SMTH_ALPHA = 0.5

# --- Beat detection (samplePeak flag) --- stricter so only real hits fire.
BEAT_THRESHOLD_MULT = 1.5
BEAT_REFRACTORY_MS = 120

# --- Output ---
SEND_HZ = 90
SILENCE_HOLD_SEC = 3

[Web]
enabled = true
host = 127.0.0.1
port = 8080
