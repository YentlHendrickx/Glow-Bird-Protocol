[WLED]
WLED_IP = 10.16.111.2
WLED_PORT = 11988

[Audio]
SAMPLE_RATE = 48000
CHUNK_BYTES = 512
GAIN = 1.0

# --- Frequency path (16 GEQ bands) --- VIBRANT: full, bright, colourful across the whole spectrum.
FFT_WINDOW_SAMPLES = 1024
BAND_AGC_DECAY = 0.997
# Fullest bars - maximum colour and movement (best for GEQ / colour effects).
BAND_GAMMA = 0.4
# Lively transients without being harsh.
BAND_ATTACK = 1.0
# No fold: every bin shows its own band so the whole spectrum drives colour.
BASS_FOLD = 0
BASS_FOLD_ONSET = 0
FOLD_WHITEN = 0
WHITEN_FLOOR = 0.08

# --- Volume path --- bright and responsive.
AGC_TARGET = 110
AGC_SPEED = 0.03
AGC_MAX_GAIN = 2000
SQUELCH = 40
SMTH_ALPHA = 0.4

# --- Beat detection (samplePeak flag) --- generous, lively.
BEAT_THRESHOLD_MULT = 1.3
BEAT_REFRACTORY_MS = 100

# --- Output ---
SEND_HZ = 90
SILENCE_HOLD_SEC = 3

[Web]
enabled = true
host = 127.0.0.1
port = 8080
