[WLED]
WLED_IP = 10.16.111.2
WLED_PORT = 11988

[Audio]
SAMPLE_RATE = 48000
CHUNK_BYTES = 512
GAIN = 1.0

# --- Frequency path (16 GEQ bands) --- TIMID: smooth, slow, gentle - calm ambient reactions.
FFT_WINDOW_SAMPLES = 1024
# Very slow fall so bars glide down instead of snapping.
BAND_AGC_DECAY = 0.999
# Moderately full bars, not sparse.
BAND_GAMMA = 0.6
# No transient punch - reactions stay soft.
BAND_ATTACK = 0.0
# No fold: gentle per-band spectrum, nothing beat-forced into bin 0.
BASS_FOLD = 0
BASS_FOLD_ONSET = 0
FOLD_WHITEN = 0
WHITEN_FLOOR = 0.08

# --- Volume path --- heavy smoothing, dim, unhurried.
AGC_TARGET = 70
AGC_SPEED = 0.01
AGC_MAX_GAIN = 2000
# Higher gate so quiet detail/noise stays dark.
SQUELCH = 60
# Low alpha = strong smoothing, fluid volume.
SMTH_ALPHA = 0.15

# --- Beat detection (samplePeak flag) --- only strong hits, well spaced.
BEAT_THRESHOLD_MULT = 2.0
BEAT_REFRACTORY_MS = 200

# --- Output ---
SEND_HZ = 90
SILENCE_HOLD_SEC = 4

[Web]
enabled = true
host = 127.0.0.1
port = 8080
