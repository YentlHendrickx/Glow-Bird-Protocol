[WLED]
WLED_IP = 10.16.111.2
WLED_PORT = 11988
HTTP_TIMEOUT = 0.6
CONTINUOUS_SEND = false
PRESENCE_GRACE_SEC = 6

[Audio]
SAMPLE_RATE = 48000
CHUNK_BYTES = 512
GAIN = 1.0

# --- Frequency path (16 GEQ bands) --- SONICBOOM: tuned from WLED's mode_particle1DsonicBoom source.
# The effect reads only fftResult[bin 0]; a boom needs loud > threshold AND (base*loud)>>10 to roll a
# non-zero particle count - so the goal is bin 0 SPIKING high on a kick and returning to ~0 between hits.
FFT_WINDOW_SAMPLES = 1024
# Slightly slower fall than punchy: a stabler auto-scale reference = more consistent beat heights and
# less pumping, so the effect's low-pass threshold tracks cleanly.
BAND_AGC_DECAY = 0.997
# Moderate contrast. Onset-fold holds the floor near 0; this keeps beat peaks high enough to emit
# particles (110px strip -> base=31, so ~loud>=130 already shows) while squashing the low "grass"
# between hits. That grass is what inflates WLED's dynamic threshold and causes BOTH missed soft
# beats AND spurious fires - keeping it down fixes both. Lower = more particles but more over-sensing.
BAND_GAMMA = 0.6
# Strong transient emphasis: only energy RISING above each band's baseline survives, so real kicks
# pop and sustained tones (the over-sensing culprit) stay low. Main knob against "misses some hits
# AND over-senses" - raise toward 3.5 if it still fires on drone/sustained content.
BAND_ATTACK = 2.8
# Fold onsets of ALL bands into bin 0 (bass-first via the pink-undo tilt): fires on an attack anywhere,
# a kick wins when present, and returns to ~0 between hits so edge detection re-arms and never skips
# at high BPM. This is what makes PS Sonic Boom reliable.
BASS_FOLD = 16
BASS_FOLD_ONSET = 1
# Whitening OFF: keeps bin 0 kick-dominant with real dynamic range for the effect's filter threshold.
# Flip to 1 if beats carried by quieter bands (some electronic / vocal tracks) get missed - the tilt
# keeps it bass-first either way. WHITEN_FLOOR nudged up so silent bins don't whiten into noise.
FOLD_WHITEN = 0
WHITEN_FLOOR = 0.10

# --- Volume path --- not used by Sonic Boom (it ignores sampleRaw/Smth), but kept sane so
# volume-reactive effects still look good if you switch to one.
AGC_TARGET = 90
AGC_SPEED = 0.02
AGC_MAX_GAIN = 2000
# Clean silence between hits so room noise can't trip a false boom.
SQUELCH = 50
SMTH_ALPHA = 0.4

# --- Beat detection (samplePeak flag) --- also NOT used by Sonic Boom (it runs its own threshold on
# bin 0), but drives other beat-reactive effects. Left moderate.
BEAT_THRESHOLD_MULT = 1.5
BEAT_REFRACTORY_MS = 120

# --- Output ---
SEND_HZ = 90
SILENCE_HOLD_SEC = 3

[Web]
enabled = true
host = 127.0.0.1
port = 8080
