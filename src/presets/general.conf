[WLED]
WLED_IP = 10.16.111.2
WLED_PORT = 11988

[Audio]
SAMPLE_RATE = 48000
CHUNK_BYTES = 512
GAIN = 1.0

# --- Frequency path (16 GEQ bands) --- GENERAL: voices, games, video - no reliable beat, so cover
# the whole spectrum evenly (speech lives in the mids, effects everywhere) rather than folding to bass.
FFT_WINDOW_SAMPLES = 1024
# Steady fall so dialogue/ambient don't flicker-drop between syllables.
BAND_AGC_DECAY = 0.998
# Balanced fullness - quiet dialogue stays visible without lighting up idle hiss.
BAND_GAMMA = 0.5
# Mild transient lift so game hits (explosions, gunshots) still pop.
BAND_ATTACK = 1.0
# No fold: every bin shows its own band; voices/effects aren't bass-driven.
BASS_FOLD = 0
BASS_FOLD_ONSET = 0
FOLD_WHITEN = 0
WHITEN_FLOOR = 0.08

# --- Volume path (this is what most voice/game reactivity rides on) ---
AGC_TARGET = 85
# Slow AGC: handles the huge quiet-dialogue -> loud-explosion range without pumping.
AGC_SPEED = 0.015
AGC_MAX_GAIN = 2000
# Gate idle hiss but keep quiet speech/ambient.
SQUELCH = 45
# Follow the speech envelope (syllables) yet smooth out flicker.
SMTH_ALPHA = 0.3

# --- Beat detection (samplePeak flag) --- fires on strong transients (hits, plosives), not chatter.
BEAT_THRESHOLD_MULT = 1.6
BEAT_REFRACTORY_MS = 140

# --- Output ---
SEND_HZ = 90
SILENCE_HOLD_SEC = 3

[Web]
enabled = true
host = 127.0.0.1
port = 8080
